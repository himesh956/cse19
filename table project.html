<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily News</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>Daily News</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">World</a></li>
                <li><a href="#">Politics</a></li>
                <li><a href="#">Sports</a></li>
                <li><a href="#">Entertainment</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Featured News Article -->
        <section class="featured-news">
            <h2>Breaking News</h2>
            <p>Stay updated with the latest news from around the world.</p>
            <img src="https://via.placeholder.com/800x400" alt="News Image">
        </section>

        <!-- Embedded YouTube Video -->
        <section class="video-news">
            <h2>News Video</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </section>

        <!-- Multimedia Section -->
        <section class="multimedia">
            <h2>Multimedia</h2>
            <h3>Audio Clip</h3>
            <audio controls>
                <source src="sample-audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <h3>Video Clip</h3>
            <video width="480" controls>
                <source src="sample-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </section>

        <!-- Hyperlinks -->
        <section class="links">
            <h2>Useful Links</h2>
            <ul>
                <li><a href="https://www.bbc.com" target="_blank">BBC News</a></li>
                <li><a href="https://www.cnn.com" target="_blank">CNN</a></li>
                <li><a href="https://www.reuters.com" target="_blank">Reuters</a></li>
            </ul>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Daily News. All Rights Reserved.</p>
    </footer>
</body>
</html>
