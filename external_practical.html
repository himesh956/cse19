<!DOCTYPE html>
<html>
<head>
<title>Responsive Navbar</title>

<style>
*{margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial}

nav{
  display:flex;
justify-content:space-between;
align-items:center;
  background:#333;
     padding:15px;
  color:white;
  position:relative;
}

.logo{font-size:20px}

ul{
list-style:none;
 display:flex;
 gap:20px; 
}

a{color:white;text-decoration:none}

#menu{display:none}

label{
  display:none;
  font-size:25px;
  cursor:pointer;
}

.container{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  padding:20px;
}

.box{
  background:lightblue;
  padding:40px;
  text-align:center;
}

@media(max-width:768px){

  label{display:block}

  ul{
    position:absolute;
    top:60px;
    right:0;
    background:#444;
    flex-direction:column;
    width:200px;
    display:none;
    padding:15px;
  }

  #menu:checked ~ ul{
    display:flex;
  }

  .container{
    grid-template-columns:1fr;
  }
}

</style>
</head>
<body>

<nav>
  <div class="logo">MySite</div>

  <input type="checkbox" id="menu">
  <label for="menu">&#9776;</label>

  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<div class="container">
  <div class="box">box 1</div>
   <div class="box">box 2</div>
   <div class="box">box 3</div> 
</div>

</body>
</html>
